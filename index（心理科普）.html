    <style>
        @import url('https://fonts.googleapis.com/css2?family=ZCOOL+QingKe+HuangYou&display=swap');

        :root {
            --primary-color: #9d6ff2;
            --secondary-color: #bc82f2;
            --error-color: #ff6666;
            --wechat-bg: #f7f7f7;
            --user-bubble: #95ec69;

        body {
            background: var(--wechat-bg);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            margin: 0;

        }

        /* 微信风格的消息容器 */
        .message-row {
            display: flex;
            margin: 12px 16px;
            align-items: flex-start;
        }

        .message-row.user {
            flex-direction: row-reverse;
        }

        .message-row.assistant {
            flex-direction: row;
        }

        /* 头像样式 */
        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 6px;
            flex-shrink: 0;
            overflow: hidden;
            margin: 0 8px;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        /* 消息气泡容器 */
        .message-content {
            max-width: 60%;
            display: flex;
            flex-direction: column;
        }

        /* 消息气泡 */
        .message-bubble {
            padding: 10px 16px;
            border-radius: 8px;
            font-size: 16px;
            line-height: 1.4;
            word-wrap: break-word;
            position: relative;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        /* 用户消息气泡 */
        .message-bubble.user {
            background: var(--user-bubble);
            color: #000;
        }

        .message-bubble.user::before {
            content: '';
            position: absolute;
            top: 12px;
            right: -6px;
            width: 0;
            height: 0;
            border-left: 6px solid var(--user-bubble);
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
        }

        /* AI消息气泡 */
        .message-bubble.assistant {
            background: var(--ai-bubble);
            color: #000;
            border: 1px solid #e5e5e5;
        }

        .message-bubble.assistant::before {
            content: '';
            position: absolute;
            top: 12px;
            left: -7px;
            width: 0;
            height: 0;
            border-right: 6px solid var(--ai-bubble);
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
        }

        /* 错误消息 */
        .message-bubble.error {
            background: var(--error-color);
            color: white;
        }
        
        /* 系统消息 */
        .message-bubble.system {
            background: #f1f1f1;
            color: #666;
            border: 1px solid #e0e0e0;
            font-size: 14px;
        }
        
        /* OCR结果消息 */

        }

            font-size: 12px;
            color: #999;
            margin-top: 4px;
            text-align: center;
        }

            text-align: right;
        }

        .message-row.assistant .message-time {
            text-align: left;
        }

            text-align: center;
            margin: 16px 0;
            position: relative;
        }

            border-radius: 4px;

            padding: 8px 12px;

        }
        
        /* 微信风格多模态输入按钮样式 */

            gap: 10px;
            margin-right: 10px;

        .recording-indicator .recording-time {

        .recording-indicator .recording-waves {

        .recording-indicator .recording-waves span:nth-child(1) { animation-delay: 0.0s; }

            margin-top: 5px;

        @keyframes wechatWave {

    </style>

    <script>
        'use strict';
        
        // 语音识别和图像处理变量
         let recognition;
         let isRecording = false;
         let recordingStartTime;
         let recordingTimer;
         let mediaRecorder;
         let audioChunks = [];
         let stream;
        
        // 初始化语音识别
         function initSpeechRecognition() {
             // 检查浏览器支持
             if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
                 // 使用标准API或webkit前缀版本
                 const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                 recognition = new SpeechRecognition();
                 recognition.continuous = true;
                 recognition.interimResults = true;
                 recognition.lang = 'zh-CN';
                 
                 recognition.onresult = function(event) {
                     let interimTranscript = '';
                     let finalTranscript = '';
                     
                     for (let i = event.resultIndex; i < event.results.length; ++i) {
                         if (event.results[i].isFinal) {
                             finalTranscript += event.results[i][0].transcript;
                         } else {
                             interimTranscript += event.results[i][0].transcript;
                         }
                     }
                     
                     if (finalTranscript) {
                         elements.input.value += finalTranscript;
                     }
                 };
                 
                 recognition.onerror = function(event) {
                     console.error('语音识别错误:', event.error);
                     stopRecording();
                 };
                 
                 recognition.onend = function() {
                     if (isRecording) {
                         stopRecording();
                     }
                 };
             } else {
                 alert('您的浏览器不支持语音识别功能');
             }
         }
        
        // 更新录音时间显示函数
         function updateRecordingTime() {
             const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
             const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
             const seconds = (elapsed % 60).toString().padStart(2, '0');
             document.querySelector('.recording-time').textContent = `${minutes}:${seconds}`;
         }
         
         // 发送音频到ASR服务
         function sendAudioToASR(audioBlob) {
             const formData = new FormData();
             formData.append('file', audioBlob);
             
             // 显示加载中消息
             const loadingMsg = createMessage('<div class="typing-indicator"><span></span><span></span><span></span></div>', 'assistant', new Date());
             elements.container.appendChild(loadingMsg);
             elements.container.scrollTop = elements.container.scrollHeight;
             
             fetch('http://localhost:5000/asr', {
                 method: 'POST',
                 body: formData
             })
             .then(response => response.json())
             .then(data => {
                 // 移除加载消息
                 if (loadingMsg && loadingMsg.parentNode) {
                     elements.container.removeChild(loadingMsg);
                 }
                 
                 if (data.error) {
                     // 显示错误消息
                     const errorMsg = `语音识别失败: ${data.error}`;
                     const now = new Date();
                     chatHistory.push({ role: 'assistant', content: errorMsg, time: now.toISOString() });
                     saveChatHistory();
                     elements.container.appendChild(createMessage(errorMsg, 'assistant', now));
                 } else if (data.baidu_result && data.baidu_result.result) {
                     // 显示识别结果
                     const recognizedText = data.baidu_result.result[0] || '未能识别出语音内容';
                     
                     if (recognizedText && recognizedText !== '未能识别出语音内容') {
                         // 将识别结果设置到输入框并自动发送
                         elements.input.value = recognizedText;
                         // 自动发送识别结果
                         setTimeout(() => {
                             elements.sendBtn.click();
                         }, 300);
                     }
                 } else {
                     // 显示错误消息
                     const errorMsg = '语音识别失败: 未返回有效结果';
                     const now = new Date();
                     chatHistory.push({ role: 'assistant', content: errorMsg, time: now.toISOString() });
                     saveChatHistory();
                     elements.container.appendChild(createMessage(errorMsg, 'assistant', now));
                 }
             })
             .catch(error => {
                 console.error('ASR请求错误:', error);
                 
                 // 移除加载消息
                 if (loadingMsg && loadingMsg.parentNode) {
                     elements.container.removeChild(loadingMsg);
                 }
                 
                 // 显示错误消息
                 const errorMsg = '语音识别服务连接失败，请确保服务器已启动';
                 const now = new Date();
                 chatHistory.push({ role: 'assistant', content: errorMsg, time: now.toISOString() });
                 saveChatHistory();
                 elements.container.appendChild(createMessage(errorMsg, 'assistant', now));
                 elements.container.scrollTop = elements.container.scrollHeight;
             });
         }
        
        // 更新录音时间显示
        function updateRecordingTime() {
            const elapsed = Math.floor((Date.now() - recordingStartTime) / 1000);
            const minutes = Math.floor(elapsed / 60).toString().padStart(2, '0');
            const seconds = (elapsed % 60).toString().padStart(2, '0');
            const timeElement = document.querySelector('.recording-time');
            timeElement.textContent = `${minutes}:${seconds}`;

                 return;
             }
             
             const reader = new FileReader();
             reader.onload = function(e) {
                 const imageData = e.target.result;
                 // 将图片添加到聊天中 - 微信风格
                 const imageMsg = `<img src="${imageData}" alt="上传的图片" class="image-preview">`;

                 elements.container.appendChild(loadingMsg);
                 elements.container.scrollTop = elements.container.scrollHeight;
                 
                 // 发送图片到OCR服务
                 sendImageToOCR(file, loadingMsg);
             };
             reader.readAsDataURL(file);
         }
         
         // 发送图片到OCR服务
          function sendImageToOCR(file, loadingMsg) {
              const formData = new FormData();
              formData.append('file', file);
              
              fetch('http://localhost:5000/ocr', {
                  method: 'POST',
                  body: formData
              })
             .then(response => response.json())
             .then(data => {
                 // 移除加载消息
                 if (loadingMsg && loadingMsg.parentNode) {
                     elements.container.removeChild(loadingMsg);
                 }
                 
                 if (data.error) {
                     // 显示错误消息
                     const errorMsg = `图片识别失败: ${data.error}`;
                     const now = new Date();
                     chatHistory.push({ role: 'assistant', content: errorMsg, time: now.toISOString() });
                     saveChatHistory();
                     elements.container.appendChild(createMessage(errorMsg, 'assistant', now));
                 } else if (data.baidu_result && data.baidu_result.words_result) {
                     // 提取百度OCR返回的文本
                     const words = data.baidu_result.words_result;
                     let recognizedText = '';
                     
                     // 合并所有识别出的文本行
                     if (words && words.length > 0) {
                         recognizedText = words.map(item => item.words).join('\n');
                     } else {
                         recognizedText = '未能识别出文字内容';
                     }
                     
                     const now = new Date();
                     
                     // 不显示识别结果，直接放入输入框等待用户确认
                     
                     // 将识别结果作为用户输入，但不自动发送
                     setTimeout(() => {
                         elements.input.value = recognizedText;
                         // 聚焦输入框，让用户可以编辑或直接发送
                         elements.input.focus();
                     }, 500);
                 } else {
                     // 显示错误消息
                     const errorMsg = '图片识别失败: 未返回有效结果';
                     const now = new Date();
                     chatHistory.push({ role: 'assistant', content: errorMsg, time: now.toISOString() });
                     saveChatHistory();
                     elements.container.appendChild(createMessage(errorMsg, 'assistant', now));
                 }
                 
                 elements.container.scrollTop = elements.container.scrollHeight;
             })
             .catch(error => {
                 console.error('OCR请求错误:', error);
                 
                 // 移除加载消息
                 if (loadingMsg && loadingMsg.parentNode) {
                     elements.container.removeChild(loadingMsg);
                 }
                 
                 // 显示错误消息
                 const errorMsg = '图片识别服务连接失败，请确保服务器已启动';
                 const now = new Date();
                 chatHistory.push({ role: 'assistant', content: errorMsg, time: now.toISOString() });
                 saveChatHistory();
                 elements.container.appendChild(createMessage(errorMsg, 'assistant', now));
                 elements.container.scrollTop = elements.container.scrollHeight;
             });
         }

        // 格式化时间
        function formatTime(date) {
            if (!date) return '';
            const d = new Date(date);
            return d.toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        // 格式化日期时间用于分割条
        function formatDateForDivider(date) {
            if (!date) return '';
            const d = new Date(date);
            const now = new Date();
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const yesterday = new Date(today.getTime() - 24 * 60 * 60 * 1000);
            const messageDate = new Date(d.getFullYear(), d.getMonth(), d.getDate());
            
            if (messageDate.getTime() === today.getTime()) {
                return '今天';
            } else if (messageDate.getTime() === yesterday.getTime()) {
                return '昨天';
            } else {
                return d.toLocaleDateString('zh-CN', { month: 'long', day: 'numeric' });
            }
        }

        // 创建时间分割条
        function createTimeDivider(date) {
            const divider = document.createElement('div');
            divider.className = 'time-divider';
            
            const text = document.createElement('div');
            text.className = 'time-divider-text';
            text.textContent = formatDateForDivider(date);
            
            divider.appendChild(text);
            return divider;
        }

        // 判断是否需要显示时间分割条
        function shouldShowTimeDivider(currentTime, lastTime) {
            if (!lastTime) return true;
            
            const current = new Date(currentTime);
            const last = new Date(lastTime);
            
            // 如果是不同的日期，显示分割条
            const currentDate = new Date(current.getFullYear(), current.getMonth(), current.getDate());
            const lastDate = new Date(last.getFullYear(), last.getMonth(), last.getDate());
            
            return currentDate.getTime() !== lastDate.getTime();
        }

            const avatarContainer = document.createElement('div');
            avatarContainer.className = 'avatar';
            avatarContainer.innerHTML = getAvatar(type);

            // 创建消息内容容器
            const messageContent = document.createElement('div');
            messageContent.className = 'message-content';

            // 创建消息气泡
            const bubble = document.createElement('div');
            bubble.className = `message-bubble ${type}`;
            bubble.innerHTML = content;

            // 创建时间戳
            const timeDiv = document.createElement('div');
            timeDiv.className = 'message-time';
            timeDiv.textContent = formatTime(time);

            // 组装消息内容
            messageContent.appendChild(bubble);
            messageContent.appendChild(timeDiv);

            // 组装整个消息行
            row.appendChild(avatarContainer);
            row.appendChild(messageContent);

            return row;
        }

                       let mimeType = 'audio/webm';

                               mimeType = 'audio/mp4';

                               // 使用默认格式

                           }
                       }
                       
                       // 创建MediaRecorder实例

                      audioChunks = [];
                      
                      mediaRecorder.ondataavailable = (event) => {
                          if (event.data.size > 0) {

                          }
                      };

        window.addEventListener('click', (event) => {
            if (event.target === elements.settingsModal) {
                elements.settingsModal.style.display = 'none';
            }
        });

        // 文件上传事件
        elements.avatarInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (file) {
                handleFileUpload(file);
            }
        });

        // 预设头像选择事件
        document.querySelectorAll('.preset-avatar').forEach(avatar => {
            avatar.addEventListener('click', () => {
                // 移除其他选中状态
                document.querySelectorAll('.preset-avatar').forEach(a => a.classList.remove('selected'));
                // 添加选中状态
                avatar.classList.add('selected');
                // 更新预览
                const avatarSrc = avatar.dataset.avatar;
                elements.currentAvatarPreview.src = avatarSrc;
            });
        });

        // 保存头像设置
        elements.saveAvatarBtn.addEventListener('click', () => {
            const selectedAvatar = document.querySelector('.preset-avatar.selected');
            if (selectedAvatar) {
                saveUserAvatar(selectedAvatar.dataset.avatar);
            } else {
                // 如果没有选中预设头像，使用当前预览的头像（可能是上传的）
                saveUserAvatar(elements.currentAvatarPreview.src);
            }
            
            // 重新渲染所有消息以更新头像
            const container = elements.container;
            const messages = [...container.children];
            container.innerHTML = '';
            
            // 重新加载聊天历史
            loadChatHistory();
            
            // 关闭模态框
            elements.settingsModal.style.display = 'none';
            
            // 显示保存成功提示
            const toast = document.createElement('div');
            toast.style.cssText = `
                position: fixed;
                top: 50%;
                left: 50%;
                transform: translate(-50%, -50%);
                background: var(--primary-color);
                color: white;
                padding: 12px 24px;
                border-radius: 6px;
                z-index: 10000;
                font-size: 14px;
            `;
            toast.textContent = '头像设置已保存！';
            document.body.appendChild(toast);
            
            setTimeout(() => {
                document.body.removeChild(toast);
            }, 2000);
        });

        // 清除聊天记录按钮事件
        elements.clearChatBtn.addEventListener('click', () => {
            // 显示确认对话框
            if (confirm('确定要清除所有聊天记录吗？此操作无法撤销！')) {
                // 清除本地存储中的聊天记录
                localStorage.removeItem(`psychologyChatHistory_${userId}`);
                
                // 清空内存中的聊天历史
                chatHistory = [];
                
                // 清空页面显示的消息
                elements.container.innerHTML = '';
                
                // 关闭设置模态框
                elements.settingsModal.style.display = 'none';
                
                // 显示成功提示
                const toast = document.createElement('div');
                toast.style.cssText = `
                    position: fixed;
                    top: 50%;
                    left: 50%;
                    transform: translate(-50%, -50%);
                    background: #27ae60;
                    color: white;
                    padding: 12px 24px;
                    border-radius: 6px;
                    z-index: 10000;
                    font-size: 14px;
                `;
                toast.textContent = '聊天记录已清除！';
                document.body.appendChild(toast);
                
                setTimeout(() => {
                    document.body.removeChild(toast);
                }, 2000);
            }
        });

        // 初始化当前头像预览
        elements.currentAvatarPreview.src = userAvatar;
    </script>
</body>

</html>
